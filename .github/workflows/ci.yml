name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DPV.sln --configuration Release

      - name: Test
        # The suite is an xUnit v3 executable. The solution test command reports zero tests for this project.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./tests/DPV.Tests/bin/Release/net10.0/DPV.Tests.exe -noColor
          else
            ./tests/DPV.Tests/bin/Release/net10.0/DPV.Tests -noColor
          fi
