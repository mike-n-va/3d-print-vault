name: Build, Test & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore DPV.sln

      - name: Build Solution (Release)
        run: dotnet build DPV.sln --configuration Release --no-restore

      - name: Run Test Suite
        # The suite is an xUnit v3 executable. The solution test command reports zero tests for this project.
        run: .\tests\DPV.Tests\bin\Release\net10.0\DPV.Tests.exe -noColor

  publish-release:
    name: Publish Standalone Release (win-x64)
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Win-x64 Single-File Bundle
        run: dotnet publish src/DPV.App/DPV.App.csproj --configuration Release -p:PublishProfile=WindowsReleaseProfile

      - name: Compress Release Artifact
        run: Compress-Archive -Path artifacts\publish\win-x64\* -DestinationPath DPV-win-x64-${{ github.ref_name }}.zip

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: DPV-win-x64-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
